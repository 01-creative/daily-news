name: Weekly Briefing

on:
  schedule:
    # 每周六 06:00 Asia/Shanghai（周五 22:00 UTC）
    - cron: "0 22 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Build prompt
        shell: bash
        run: |
          export TZ=Asia/Shanghai

          TODAY=$(date +%F)
          START_TIME=$(date -d "7 days ago 06:00" +"%Y-%m-%d %H:%M")
          END_TIME=$(date -d "today 06:00" +"%Y-%m-%d %H:%M")
          WEEK_START=$(date -d "$START_TIME" +%F)
          echo "BRIEFING_DATE=${TODAY}" >> $GITHUB_ENV

          mkdir -p ctf-training/周报

          sed \
            -e "s|{start_time}|${START_TIME}|g" \
            -e "s|{end_time}|${END_TIME}|g" \
            -e "s|{week_start}|${WEEK_START}|g" \
            -e "s|{today}|${TODAY}|g" \
            scripts/daily-briefing/prompt.md \
            > /tmp/prompt.md

          {
            echo
            echo "## 上一期周报（仅用于去重）"

            if ls ctf-training/周报/*.md >/dev/null 2>&1; then
              latest=$(ls -t ctf-training/周报/*.md | head -1)
              echo
              echo "---"
              cat "$latest"
            else
              echo "暂无历史周报，本次不做去重。"
            fi
          } >> /tmp/prompt.md

          echo "Prompt built:"
          echo "  Today     : ${TODAY}"
          echo "  Week start: ${WEEK_START}"
          echo "  Window    : ${START_TIME} -> ${END_TIME}"

      - name: Generate briefing
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_MODEL: deepseek-v4-flash
          ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek-v4-flash
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-v4-flash
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
          CLAUDE_CODE_SUBAGENT_MODEL: deepseek-v4-flash
        run: |
          claude \
            -p "$(cat /tmp/prompt.md)" \
            --output-format text \
            --allowedTools WebSearch,WebFetch,Write,Bash

      - name: Push to Feishu
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python scripts/daily-briefing/feishu_push.py

      - name: Archive
        run: |
          export TZ=Asia/Shanghai

          git config user.name "Weekly Briefing Bot"
          git config user.email "bot@01-creative.com"

          git add ctf-training/周报/

          if ! git diff --cached --quiet; then
            git commit -m "Weekly briefing $(date +%F)"
            git push
          else
            echo "No changes to commit."
          fi
